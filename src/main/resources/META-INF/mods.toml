modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
 modId = "${mod_id}"
 version = "${mod_version}"
 displayName = "${mod_name}"
 logoFile = "atmosphera.png"
 authors = "${mod_authors}"
 credits = "Made by SolarBiscuit. All Rights Reserved; unmodified jars may be included in modpacks with credit (see LICENSE)."
 description = '''${mod_description}'''
 # Client-only: never required on servers, never blocks joining a server without it.
 displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
  modId = "forge"
  mandatory = true
  versionRange = "${forge_version_range}"
  ordering = "NONE"
  side = "CLIENT"

[[dependencies.${mod_id}]]
  modId = "minecraft"
  mandatory = true
  versionRange = "${minecraft_version_range}"
  ordering = "NONE"
  side = "CLIENT"

# Post passes, frame uniforms, the cloud cover service, wind, the DH and Voxy bridges. Constructed first so Atmosphera can
# register.
[[dependencies.${mod_id}]]
  modId = "atmospheralib"
  mandatory = true
  versionRange = "${lib_version_range}"
  ordering = "AFTER"
  side = "CLIENT"
